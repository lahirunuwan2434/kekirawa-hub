<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kekirawa Hub - Developed by Lahiru Bandara</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #0284c7;
            --success: #10b981;
            --warning: #f59e0b;
            --text-light: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.8);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body {
            background-color: var(--primary);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .slider-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
        }

        .slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: translateX(-100%);
            transition: opacity 0.5s ease-in-out, transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.85));
            z-index: -1;
        }

        .slide.active { opacity: 1; transform: translateX(0); }
        .slide.exit { opacity: 0; transform: translateX(100%); }

        .login-container {
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            z-index: 10;
            animation: fadeIn 0.5s ease-out;
        }

        .login-container h2 { color: #1e293b; margin-bottom: 8px; font-size: 28px; }
        p.subtitle { color: #64748b; font-size: 14px; margin-bottom: 24px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; color: #475569; font-size: 14px; margin-bottom: 6px; font-weight: 500; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px 16px; border: 2px solid #cbd5e1; border-radius: 8px;
            font-size: 16px; color: #0f172a; outline: none; transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #4f46e5; }
        .login-btn {
            width: 100%; padding: 12px; background-color: #4f46e5; color: white; border: none;
            border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s;
        }
        .login-btn:hover { background-color: #4338ca; }

        .error-message {
            color: #ef4444; background-color: #fee2e2; padding: 10px; border-radius: 8px;
            font-size: 14px; margin-bottom: 20px; display: none; border: 1px solid #fca5a5;
            animation: shake 0.2s ease-in-out 0s 2;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }

        .container {
            max-width: 1000px; margin: 0 auto; padding: 20px; width: 100%; height: 92vh;
            display: none; flex-direction: column; position: relative;
        }

        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; animation: fadeIn 0.4s ease forwards; }
        .screen.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

        h1 { font-size: 3.5rem; text-align: center; margin-bottom: 10px; color: #fff; text-shadow: 0 0 25px rgba(2,132,199,0.6); }
        .welcome-animated {
            font-size: 2.8rem; font-weight: 800; text-align: center; margin-bottom: 40px;
            background: linear-gradient(to right, #fff, var(--accent), #fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: pulseText 3s infinite ease-in-out;
        }

        @keyframes pulseText { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .sub-title { font-size: 1.6rem; color: #38bdf8; margin-bottom: 25px; font-weight: bold; text-align: center; }

        .btn-grid { display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; max-width: 450px; }
        .btn {
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            color: white; border: none; padding: 14px 25px; border-radius: 12px;
            font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: all 0.25s ease; text-align: center;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(2, 132, 199, 0.4); }
        
        .btn-total-summary {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3) !important;
            border: 1px solid #34d399 !important;
        }
        .btn-total-summary:hover {
            background: linear-gradient(135deg, #059669, #047857) !important;
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.5) !important;
        }

        .btn-back {
            background: linear-gradient(135deg, #64748b, #475569);
            color: white; border: none; padding: 10px 20px; border-radius: 8px;
            font-size: 1.3rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
            margin-top: 25px; width: 100%; max-width: 100px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-back:hover { transform: translateY(-1px); background: linear-gradient(135deg, #475569, #334155); }

        .top-logout-container { position: absolute; top: 10px; right: 20px; z-index: 20; }
        .btn-logout { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-logout:hover { background: linear-gradient(135deg, #dc2626, #b91c1c); }

        .data-card {
            background: var(--card-bg); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 25px; width: 100%; max-width: 750px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; align-items: center; max-height: 80vh; overflow-y: auto;
        }
        .data-card h3 { color: #38bdf8; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--accent); font-size: 1.3rem; width: 100%; text-align: center; }
        
        .table-responsive { width: 100%; overflow-x: auto; margin-bottom: 15px; border-radius: 8px; }
        .june-table { width: 100%; border-collapse: collapse; text-align: left; background: rgba(15, 23, 42, 0.6); color: #fff; }
        .june-table th, .june-table td { padding: 12px; border: 1px solid rgba(255,255,255,0.1); font-size: 0.95rem; }
        .june-table th { background-color: rgba(2, 132, 199, 0.8); color: white; font-weight: 600; }
        .june-table tr:nth-child(even) { background-color: rgba(255,255,255,0.03); }
        .june-table tr:hover { background-color: rgba(2, 132, 199, 0.2); }

        .total-highlight { background-color: rgba(16, 185, 129, 0.15) !important; color: #10b981 !important; }

        .data-body-wrapper { width: 100%; }
        .data-row { display: flex; justify-content: space-between; padding: 12px 5px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .data-row:last-child { border-bottom: none; }
        .data-label { color: #cbd5e1; font-weight: 500; }
        .data-value { color: #ffffff; font-weight: bold; font-size: 1.1rem; }

        .footer-static {
            position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 23, 42, 0.85); border-top: 1px solid rgba(255,255,255,0.05);
            padding: 10px 0; text-align: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.3); z-index: 25; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .footer-text { font-weight: 700; font-size: 0.85rem; letter-spacing: 1.5px; display: inline-block; background: linear-gradient(135deg, #e2e8f0 0%, #ffffff 50%, #cbd5e1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
    </style>
</head>

            slides[nextSlideIdx].classList.remove('exit');
            slides[nextSlideIdx].classList.add('active');

        function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            if (!usersDatabase.hasOwnProperty(usernameInput) || passwordInput !== usersDatabase[usernameInput].password) {
                errorBox.innerText = "❌ Username හෝ Password වැරදියි!";
                errorBox.style.display = 'block';
                return;
            }
            activeUser = usernameInput;
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dashboardContainer').style.display = 'flex';
            navigationHistory = ['scrHome'];
            showScreen('scrHome');
        }

        function logout() {
            document.getElementById('dashboardContainer').style.display = 'none';
            document.getElementById('loginBox').style.display = 'block';
            activeUser = ""; navigationHistory = [];
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const targetScreen = document.getElementById(id);
            if(targetScreen) targetScreen.classList.add('active');
        }

        function navigateTo(id) { navigationHistory.push(id); showScreen(id); }
        function goBack() {
            if (navigationHistory.length > 1) {
                navigationHistory.pop();
                showScreen(navigationHistory[navigationHistory.length - 1]);
            }

        let currentMonth = '';
        let currentDept = '';
        let selectedJuneOfficer = '';

        function selectMonth(month) {
            currentMonth = month;
            if (month === 'June') {
                document.getElementById('selDeptLabel').innerText = "June Division Selection";
                const list = document.getElementById('officerList');
                list.innerHTML = '';
                
                const recBtn = document.createElement('button');
                recBtn.className = 'btn';
                recBtn.innerText = "Recovery Dashboard";
                recBtn.onclick = () => {
                    document.getElementById('selDeptLabel').innerText = "June - Recovery Officers";
                    renderJuneRecoveryList();
                };
                list.appendChild(recBtn);

                const markBtn = document.createElement('button');
                markBtn.className = 'btn';
                markBtn.innerText = "Marketing Dashboard";
                markBtn.onclick = () => {
                    document.getElementById('selDeptLabel').innerText = "June - Marketing (Independent)";
                    renderJuneMarketingList();
                };
                list.appendChild(markBtn);
                
                navigateTo('scrOfficers');
            } else {
                document.getElementById('selDeptLabel').innerText = month + " - 2026 Dashboard";
                document.getElementById('btnDueLabel').innerText = "Due " + month + " Info";
                navigateTo('scrDept');
            }
        }

        function renderJuneRecoveryList() {
            const list = document.getElementById('officerList');
            list.innerHTML = '';
            Object.keys(juneDataset).forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'btn' + (name === "Total Summary" ? ' btn-total-summary' : '');
                btn.innerText = name;
                btn.onclick = () => {
                    selectedJuneOfficer = name;
                    document.getElementById('juneOfficerLabel').innerText = name + " - Performance Categories";
                    navigateTo('scrJuneTargets');
                };
                list.appendChild(btn);
            });
        }

        function renderJuneMarketingList() {
            const list = document.getElementById('officerList');
            list.innerHTML = '';
            Object.keys(juneMarketingData).forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = name;
                btn.onclick = () => {
                    const off = juneMarketingData[name];
                    const title = document.getElementById('finalTitle');
                    const body = document.getElementById('finalDataBody');
                    title.innerText = name + " - June Marketing (Independent)";
                    body.innerHTML = createRow("Target", "Rs. " + off.target) +
                                     createRow("Number of Facility", off.facility) +
                                     createRow("Achievement", "Rs. " + off.achieve) +
                                     createRow("Ratio (%)", off.ratio);
                    navigateTo('scrFinal');
                };
                list.appendChild(btn);
            });
        }

        function selectDept(dept) {
            currentDept = dept;
            document.getElementById('selDeptLabel').innerText = currentMonth + " " + dept + " Division";
            const list = document.getElementById('officerList');
            list.innerHTML = '';
            allData[currentMonth][dept].forEach((off, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = off.name;
                btn.onclick = () => {
                    const officer = allData[currentMonth][currentDept][idx];
                    const body = document.getElementById('finalDataBody');
                    const title = document.getElementById('finalTitle');
                    body.innerHTML = '';
                    if(currentDept === 'Recovery') {
                        document.getElementById('selOfficerLabel').innerText = officer.name + " (" + currentMonth + ")";
                        window.currentOfficerIdxLegacy = idx; 
                        navigateTo('scrRecCategory');
                    } else {
                        title.innerText = officer.name + " - " + currentMonth + " Marketing";
                        body.innerHTML = createRow("Target", "Rs. " + officer.data.target) +
                                         createRow("Number of Facility", officer.data.facility) +
                                         createRow("Achievement", "Rs. " + officer.data.achieve) +
                                         createRow("Ratio (%)", officer.data.ratio);
                        navigateTo('scrFinal');
                    }
                };
                list.appendChild(btn);
            });
            navigateTo('scrOfficers');
        }

        function selectRecCat(cat) {
            const officer = allData[currentMonth].Recovery[window.currentOfficerIdxLegacy];
            const body = document.getElementById('finalDataBody');
            const title = document.getElementById('finalTitle');
            body.innerHTML = '';
            if(cat === 'due') {
                title.innerText = "Due " + currentMonth + " Breakdown (" + officer.name + ")";
                body.innerHTML = createRow("Sum of Portfolio", "Rs. " + officer.due.portfolio) + createRow("Number of Facility", officer.due.facility) + createRow("Rental Due Amount", "Rs. " + officer.due.dueAmt) + createRow("Collection", "Rs. " + officer.due.collection) + createRow("Ratio", officer.due.ratio) + createRow("Cumulative Add / Reversal", "Rs. " + officer.due.addRev);
            } else if (cat === 'np') {
                title.innerText = "NP Case Analysis (" + officer.name + ")";
                body.innerHTML = createRow("NP Count", officer.np.count) + createRow("Rental Arrears", "Rs. " + officer.np.arrears) + createRow("Portfolio", "Rs. " + officer.np.portfolio) + createRow("NP Ratio", officer.np.ratio);
            } else if (['m6', 'm12', 'm18'].includes(cat)) {
                title.innerText = cat.toUpperCase() + " Status (" + officer.name + ")";
                body.innerHTML = createRow("Rental Arrears", "Rs. " + officer[cat].arrears) + createRow("Portfolio", "Rs. " + officer[cat].portfolio) + createRow("Ratio", officer[cat].ratio);
            } else if (cat === 'notPaid') {
                title.innerText = "Not Paid Summary (" + officer.name + ")";
                body.innerHTML = createRow("Number of Facility", officer.notPaid.facility) + createRow("Sum of Rental Arrears", "Rs. " + officer.notPaid.arrears) + createRow("Sum of Portfolio", "Rs. " + officer.notPaid.portfolio);
            }
            navigateTo('scrFinal');
        }

        function selectJuneCategory(categoryType) {
            const body = document.getElementById('finalDataBody');
            const title = document.getElementById('finalTitle');
            body.innerHTML = '';
            let categoryName = (categoryType === 'due') ? "Due Target" : (categoryType === 'monthly') ? "Monthly Target Achievement" : "Weekly Target - 77%";
            title.innerText = selectedJuneOfficer + " - " + categoryName;
            const rowsData = juneDataset[selectedJuneOfficer][categoryType];
            let tableHtml = `<div class="table-responsive"><table class="june-table"><thead><tr><th>Description / Metric</th><th>Value</th></tr></thead><tbody>`;
            rowsData.forEach(row => {
                let rowStyle = (selectedJuneOfficer === "Total Summary") ? 'class="total-highlight"' : '';
                tableHtml += `<tr ${rowStyle}><td><strong>${row.Parameter}</strong></td><td>${row.Value}</td></tr>`;
            });
            tableHtml += `</tbody></table></div>`;
            body.innerHTML = tableHtml;
            navigateTo('scrFinal');
        }

        function createRow(label, value) {
            return `<div class="data-row"><span class="data-label">${label}</span><span class="data-value">${value}</span></div>`;
        }

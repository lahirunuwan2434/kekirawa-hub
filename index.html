<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kekirawa Hub - Developed by Lahiru Bandara</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #0284c7;
            --success: #10b981;
            --warning: #f59e0b;
            --text-light: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.8);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body {
            background-color: var(--primary);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* GLOBAL BACKGROUND SLIDER (RUNS ON EVERY PAGE) */
        .slider-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
        }

        .slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: translateX(-100%);
            transition: opacity 0.5s ease-in-out, transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Overlay for darkness & readability over images */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.85));
            z-index: -1;
        }

        /* Slider Animations */
        .slide.active {
            opacity: 1;
            transform: translateX(0);
        }

        .slide.exit {
            opacity: 0;
            transform: translateX(100%);
        }

        /* LOGIN SCREEN STYLES */
        .login-container {
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            z-index: 10;
            animation: fadeIn 0.5s ease-out;
        }

        .login-container h2 {
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 28px;
        }

        p.subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #475569;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #4f46e5;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .login-btn:hover {
            background-color: #4338ca;
        }

        .error-message {
            color: #ef4444;
            background-color: #fee2e2;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #fca5a5;
            animation: shake 0.2s ease-in-out 0s 2;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }

        /* MAIN HUB / DASHBOARD STYLES */
        .container {
            max-width: 900px; 
            margin: 0 auto; 
            padding: 20px;
            width: 100%;
            height: 92vh; 
            display: none; 
            flex-direction: column;
            position: relative;
        }

        .screen {
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            height: 100%; 
            animation: fadeIn 0.4s ease forwards;
        }

        .screen.active { display: flex; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: scale(0.97); } 
            to { opacity: 1; transform: scale(1); } 
        }

        /* Headings */
        h1 { font-size: 3.5rem; text-align: center; margin-bottom: 10px; color: #fff; text-shadow: 0 0 25px rgba(2,132,199,0.6); }

        .welcome-animated {
            font-size: 2.8rem; font-weight: 800; text-align: center; margin-bottom: 40px;
            background: linear-gradient(to right, #fff, var(--accent), #fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: pulseText 3s infinite ease-in-out;
        }

        @keyframes pulseText {
            0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); }
        }

        .sub-title { font-size: 1.6rem; color: #38bdf8; margin-bottom: 25px; font-weight: bold; text-align: center; }

        /* Button Layouts */
        .btn-grid { display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; max-width: 450px; }

        .btn {
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            color: white; border: none; padding: 14px 25px; border-radius: 12px;
            font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: all 0.25s ease; text-align: center;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(2, 132, 199, 0.4); }

        .btn-total {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .btn-total:hover { background: linear-gradient(135deg, #059669, #047857); }

        /* NEW BACK BUTTON STYLE (MODIFIED TO AN ARROW) */
        .btn-back {
            background: linear-gradient(135deg, #64748b, #475569);
            color: white; border: none; padding: 10px 20px; border-radius: 8px;
            font-size: 1.3rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
            margin-top: 25px; width: 100%; max-width: 100px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-back:hover { transform: translateY(-1px); background: linear-gradient(135deg, #475569, #334155); }

        /* Top Bar Logout */
        .top-logout-container {
            position: absolute;
            top: 10px;
            right: 20px;
            z-index: 20;
        }
        .btn-logout {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white; border: none; padding: 8px 16px; border-radius: 8px;
            font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-logout:hover { background: linear-gradient(135deg, #dc2626, #b91c1c); }

        /* Result Cards */
        .data-card {
            background: var(--card-bg); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 30px; width: 100%; max-width: 650px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; align-items: center;
        }
        .data-card h3 {
            color: #38bdf8;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent);
            font-size: 1.3rem;
            width: 100%;
            text-align: center;
        }
        .data-body-wrapper { width: 100%; }
        .data-row {
            display: flex; justify-content: space-between; padding: 12px 5px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .data-row:last-child { border-bottom: none; }
        .data-label { color: #cbd5e1; font-weight: 500; }
        .data-value { color: #ffffff; font-weight: bold; font-size: 1.1rem; }

        /* FIXED STATIC FOOTER (MODIFIED) */
        .footer-static {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.85); border-top: 1px solid rgba(255,255,255,0.05);
            padding: 10px 0; text-align: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .footer-text {
            font-weight: 700; font-size: 0.85rem; letter-spacing: 1.5px;
            display: inline-block;
            background: linear-gradient(135deg, #e2e8f0 0%, #ffffff 50%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
    </style>
</head>

        let currentMonth = '';
        let currentDept = '';
        let currentOfficerIndex = -1;

        function selectMonth(month) {
            currentMonth = month;
            document.getElementById('selMonthLabel').innerText = month + " - 2026 Dashboard";
            document.getElementById('btnDueLabel').innerText = "Due " + month + " Info";
            navigateTo('scrDept');
        }

        function selectDept(dept) {
            currentDept = dept;
            document.getElementById('selDeptLabel').innerText = currentMonth + " " + dept + " Division";
            const list = document.getElementById('officerList');
            list.innerHTML = '';

            allData[currentMonth][dept].forEach((off, idx) => {
                const btn = document.createElement('button');
                btn.className = off.isTotal ? 'btn btn-total' : 'btn';
                btn.innerText = off.name;
                btn.onclick = () => selectOfficer(idx);
                list.appendChild(btn);
            });
            navigateTo('scrOfficers');
        }

        function selectOfficer(idx) {
            currentOfficerIndex = idx;
            const officer = allData[currentMonth][currentDept][idx];
            if(currentDept === 'Recovery') {
                document.getElementById('selOfficerLabel').innerText = officer.name + " (" + currentMonth + ")";
                navigateTo('scrRecCategory');
            } else {
                showMarketingFinal(officer);
            }
        }

        function selectRecCat(cat) {
            const officer = allData[currentMonth].Recovery[currentOfficerIndex];
            const body = document.getElementById('finalDataBody');
            const title = document.getElementById('finalTitle');
            body.innerHTML = '';

            if(cat === 'due') {
                title.innerText = "Due " + currentMonth + " Breakdown (" + officer.name + ")";
                body.innerHTML = createRow("Sum of Portfolio", "Rs. " + officer.due.portfolio) +
                                  createRow("Number of Facility", officer.due.facility) +
                                  createRow("Rental Due Amount", "Rs. " + officer.due.dueAmt) +
                                  createRow("Collection", "Rs. " + officer.due.collection) +
                                  createRow("Ratio", officer.due.ratio) +
                                  createRow("Cumulative Add / Reversal", "Rs. " + officer.due.addRev);
            } else if (cat === 'np') {
                title.innerText = "NP Case Analysis (" + officer.name + ")";
                body.innerHTML = createRow("NP Count", officer.np.count) +
                                  createRow("Rental Arrears", "Rs. " + officer.np.arrears) +
                                  createRow("Portfolio", "Rs. " + officer.np.portfolio) +
                                  createRow("NP Ratio", officer.np.ratio);
            } else if (['m6', 'm12', 'm18'].includes(cat)) {
                const period = cat === 'm6' ? "06 Month Arrears" : cat === 'm12' ? "12 Month Arrears" : "18 Month Arrears";
                title.innerText = period + " Status (" + officer.name + ")";
                body.innerHTML = createRow("Rental Arrears", "Rs. " + officer[cat].arrears) +
                                  createRow("Portfolio", "Rs. " + officer[cat].portfolio) +
                                  createRow("Ratio", officer[cat].ratio);
            } else if (cat === 'notPaid') {
                title.innerText = "Not Paid Summary (" + officer.name + ")";
                body.innerHTML = createRow("Number of Facility", officer.notPaid.facility) +
                                  createRow("Sum of Rental Arrears", "Rs. " + officer.notPaid.arrears) +
                                  createRow("Sum of Portfolio", "Rs. " + officer.notPaid.portfolio);
            }

            navigateTo('scrFinal');
        }

        function showMarketingFinal(officer) {
            const body = document.getElementById('finalDataBody');
            const title = document.getElementById('finalTitle');
            title.innerText = officer.name + " - " + currentMonth + " Marketing";
            body.innerHTML = createRow("Target", "Rs. " + officer.data.target) +
                             createRow("Number of Facility", officer.data.facility) +
                             createRow("Achievement", "Rs. " + officer.data.achieve) +
                             createRow("Ratio (%)", officer.data.ratio);

            navigateTo('scrFinal');
        }

        function createRow(label, value) {
            return `<div class="data-row"><span class="data-label">${label}</span><span class="data-value">${value}</span></div>`;
        }
